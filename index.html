<style>
:root{--line:#e2e5e9;--muted:#6b7280;--ac:#4f7cff;box-sizing:border-box}

button:hover{background:#eef1f6}button:active{transform:scale(.94)}
button.on{background:linear-gradient(135deg,#4f7cff,#8b5cf6);color:#fff;box-shadow:0 4px 14px rgba(91,110,255,.45)}
button.t{padding:0 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools{left:12px;top:50%;transform:translateY(-50%);flex-direction:column}
#opts{left:66px;top:50%;transform:translateY(-50%);flex-direction:column;align-items:stretch;gap:10px;padding:12px;width:176px;font-size:12px;color:#6b7280}
#shapes{left:50%;bottom:12px;transform:translateX(-50%)}
#top{left:50%;top:10px;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;max-width:96vw}

#morePanel{right:12px;top:60px;width:200px;align-items:stretch;gap:2px;padding:8px}#morePanel button{width:100%;place-items:center start;padding:0 10px}
#dlg{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(30,40,70,.28)}#dlg .box{background:#fff;border-radius:18px;padding:20px;width:min(340px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:16px;line-height:1.4}#dlg .btns{display:flex;gap:8px;justify-content:flex-end}#dlg button.t{height:36px;padding:0 16px;border:1px solid var(--line)}
.off{display:none!important}
#credit{position:fixed;left:46px;bottom:14px;font-size:11px;color:#6b7280;opacity:.6;z-index:2;pointer-events:none}
#morePanel a{height:34px;display:flex;align-items:center;padding:0 10px;border-radius:10px;color:#1f2328;text-decoration:none;font-size:12.5px;font-weight:600}#morePanel a:hover{background:#eef1f6}
body.hideui .pill{display:none!important}#showui{position:fixed;left:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);opacity:.25;z-index:4;display:none}body.hideui #showui{display:block}#showui:hover{opacity:.9}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #e2e5e9}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:11.5px;text-align:center}
.card canvas{width:100%;aspect-ratio:16/9;border-radius:7px;border:1px solid var(--line)}
.card.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(79,124,255,.3)}

.li{padding:9px 10px;border-radius:10px;cursor:pointer;background:#fff;border:1px solid var(--line)}.li:hover{border-color:var(--ac)}
#tin{position:fixed;display:none;z-index:6;border:1px dashed var(--ac);background:rgba(255,255,255,.6);outline:none;padding:0 2px;font-family:system-ui,"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif}

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const RED='#d96a7f', DK='#4b4b5c', TOOLS={pen:{w:1,op:1,pr:1},pencil:{w:.7,op:.8,pr:1},marker:{w:3,op:.55},hl:{w:7,op:.4,mul:1}};
const IC={pen:'M4 20l1-4L16 5l3 3L8 19z',pencil:'M4 20h4L19 9l-4-4L4 16zM13 7l4 4',marker:'M6 19l1.5-4.5L16 6l3 3-8.5 8.5zM6 19h6',hl:'M5 17l7-7 4 4-5 5H5zM14 8l3-3 3 3-3 3',eraser:'M4 15l8-8 7 7-5 5H8zM8 19h12',laser:'M12 9a3 3 0 100 6 3 3 0 000-6zM12 3v3M12 18v3M3 12h3M18 12h3',text:'M6 6h12M12 6v13M9 19h6',hand:'M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3',undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',line:'M5 19L19 5',rect:'M5 6h14v12H5z',ellipse:'M12 6c4.4 0 8 2.7 8 6s-3.6 6-8 6-8-2.7-8-6 3.6-6 8-6z',tri:'M12 5l8 14H4z',arrow:'M5 19L19 5M10 5h9v9'};
const ico=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const S={tool:'pen',color:'#111111',size:3,smooth:.6,assist:true,cur:null,hover:null,pan:null,space:false,lz:[],er:null};
const stage=$('#stage'),paperC=$('#paper'),inkC=$('#ink'),liveC=$('#live');
const pc=paperC.getContext('2d'),ic=inkC.getContext('2d'),lc=liveC.getContext('2d',{desynchronized:true});
let dpr=1;

/* ================= paper templates ================= */
const mk=(kind,sp,o={})=>Object.assign({kind,sp,line:'#b4c0d6',bg:'#ffffff',mOn:false,mSide:'left'},o);
const GROUPS={
 English:[['four','Four-line',mk('four',36,{line:DK,mOn:1})],['fourd','Four-line dotted',mk('four',36,{line:DK,dotted:1,mOn:1})],['single','Single-line',mk('ruled',48)],['double','Double-line',mk('double',56)]],
 Maths:[['gs','Small grid',mk('grid',20)],['gl','Large grid',mk('grid',40)],['gm','Major grid',mk('grid',20,{major:1})],['mp','Maths working',mk('mplain',60)]],
 Language:[['ur','Urdu',mk('ruled',64,{mOn:1,mSide:'right'})],['ar','Arabic',mk('ruled',58,{mOn:1,mSide:'right'})],['mr','Right margin',mk('ruled',48,{mOn:1,mSide:'right'})],['ml','Left margin',mk('ruled',48,{mOn:1})],['il','Interleaf',mk('interleaf',44,{mOn:1})],['pr','Plain ruled',mk('ruled',40)]],
 General:[['bl','Blank',mk('blank',40)],['dt','Dotted',mk('dots',30)],['gt','Light grid',mk('grid',30,{line:'#dde3ee'})],['cu','Custom ruled',mk('ruled',48)]]};
const PM={};Object.values(GROUPS).flat().forEach(([id,name,p])=>PM[id]={name,p});
/* Draws the paper for the visible WORLD rectangle only, using modulo arithmetic, so the
   board is infinite: lines are generated where you look, never stored. */
function drawPaper(c,P,x0,y0,x1,y1,kz,mn=0){
  const lw=Math.max(1.2,mn),sp=P.sp,k=P.kind;c.strokeStyle=c.fillStyle=P.line;c.lineWidth=lw;c.setLineDash([]);
  const L=(a,b,d,e)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke()},H=y=>L(x0,y,x1,y),V=x=>L(x,y0,x,y1);
  const fy=(st,f)=>{if(st*kz<3)return;for(let y=Math.floor(y0/st)*st;y<=y1;y+=st)f(y)},fx=(st,f)=>{if(st*kz<3)return;for(let x=Math.floor(x0/st)*st;x<=x1;x+=st)f(x)};
  if(k==='ruled'||k==='interleaf')fy(sp,H);
  else if(k==='double')fy(sp*1.4,y=>{H(y);H(y+sp*.3)});
  else if(k==='four')fy(sp*5.2,y=>{c.strokeStyle=RED;H(y);H(y+3*sp);c.strokeStyle=P.line;if(P.dotted)c.setLineDash([lw*2,lw*3]);H(y+sp);H(y+2*sp);c.setLineDash([])});
  else if(k==='grid'){const mj=v=>P.major&&Math.round(v/sp)%5===0,f=(g,l)=>v=>{c.strokeStyle=mj(v)?'#7f93b5':P.line;c.lineWidth=mj(v)?lw*1.6:lw;l(v)};fx(sp,f(0,V));fy(sp,f(0,H))}
  else if(k==='dots'){if(sp*kz>=6)fx(sp,x=>fy(sp,y=>{c.beginPath();c.arc(x,y,Math.max(1.8,mn*1.1),0,7);c.fill()}))}
  else if(k==='mplain'){c.setLineDash([lw*5,lw*5]);fx(800,V);c.setLineDash([])}
  if(P.mOn&&k!=='blank'){c.strokeStyle=RED;c.lineWidth=lw*1.3;const x=P.mSide==='left'?0:1600;if(x>=x0-8&&x<=x1+8){V(x);V(x+(P.mSide==='left'?-5:5))}}
}

/* Line assist: nearest WRITING line (the baseline) for ruled-type paper; null where there is none (grid, blank...) */
const baseY=(P,y)=>{const sp=P.sp,k=P.kind;let st,off;if(k==='four'){st=sp*5.2;off=2*sp}else if(k==='ruled'||k==='interleaf'){st=sp;off=0}else if(k==='double'){st=sp*1.4;off=sp*.3}else return null;return Math.round((y-off)/st)*st+off};
function levelStroke(s){const P=pg().paper,sp=P.sp;if(baseY(P,0)===null)return;const ys=s.pts.map(p=>p.y).sort((a,b)=>a-b),h=ys[ys.length-1]-ys[0],xs=s.pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs),now=performance.now();let dy=null;
  if(h>=.35*sp){const b=ys[Math.floor((ys.length-1)*.9)];dy=baseY(P,b)-b;if(Math.abs(dy)>.6*sp)dy=null;else S.ls={dy,x:x1,t:now}}   // letter bottoms sit on the baseline
  else if(S.ls&&now-S.ls.t<3000&&Math.abs(x0-S.ls.x)<sp*3)dy=S.ls.dy;                                                              // dots and crossbars follow the letter before them
  if(dy)s.pts.forEach(p=>p.y+=dy)}
/* ================= document / pages ================= */
const newPage=(paper)=>({paper:Object.assign({},paper||PM.four.p),items:[],h:[],f:[],view:{x:150,y:80,k:1}});
let doc={id:Date.now(),name:'Untitled lesson',pages:[newPage()],cur:0};
const pg=()=>doc.pages[doc.cur];
let svT;function sv(){clearTimeout(svT);svT=setTimeout(async()=>{await dbq('readwrite',s=>s.put({id:doc.id,name:doc.name,upd:Date.now(),cur:doc.cur,pages:doc.pages.map(p=>({paper:p.paper,items:p.items,view:p.view}))}))},500)}
/* IndexedDB: everything is saved on this computer, no internet needed */
const idb=new Promise(r=>{try{const q=indexedDB.open('whiteboard',1);q.onupgradeneeded=()=>q.result.createObjectStore('l',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbq=async(m,f)=>{const d=await idb;if(!d)return;return new Promise(r=>{try{const o=f(d.transaction('l',m).objectStore('l'));o.onsuccess=()=>r(o.result);o.onerror=()=>r()}catch(e){r()}})};
function hydrate(d){doc={id:d.id,name:d.name,cur:d.cur||0,pages:d.pages.map(p=>({paper:p.paper,items:p.items,view:p.view,h:[],f:[]}))};$('#nm').value=doc.name;go(doc.cur)}
function go(i){doc.cur=Math.max(0,Math.min(doc.pages.length-1,i));$('#pn').textContent=`${doc.cur+1}/${doc.pages.length}`;syncCtl();vchg();pagesUI()}
$('#pp').onclick=()=>go(doc.cur-1);$('#pnx').onclick=()=>go(doc.cur+1);
$('#addp').onclick=()=>{doc.pages.splice(doc.cur+1,0,newPage(pg().paper));go(doc.cur+1);sv()};
$('#dupp').onclick=()=>{const p=pg(),n=newPage(p.paper);n.items=JSON.parse(JSON.stringify(p.items));n.view={...p.view};doc.pages.splice(doc.cur+1,0,n);go(doc.cur+1);sv()};
/* The browser's built-in popup dialogs are blocked in many embedded views, so the app uses its own dialog */
function ask(msg,ok,label){$('#dmsg').textContent=msg;const d=$('#dlg'),y=$('#dok'),n=$('#dno');d.classList.remove('off');y.style.display=ok?'':'none';y.textContent=label||'Yes';n.textContent=ok?'Cancel':'OK';
  y.onclick=()=>{d.classList.add('off');ok&&ok()};n.onclick=()=>d.classList.add('off')}
$('#delp').onclick=()=>{if(doc.pages.length<2){ask('A lesson needs at least one page. Use Clear page to empty it instead.');return}ask(`Delete page ${doc.cur+1}? This cannot be undone.`,()=>{doc.pages.splice(doc.cur,1);go(doc.cur);sv()},'Delete page')};
$('#clr').onclick=()=>{if(!pg().items.length){ask('This page is already empty.');return}ask('Clear everything on this page? You can still press Undo afterwards.',()=>{hpush();pg().items=[];ri();sv()},'Clear page')};
$('#nm').oninput=e=>{doc.name=e.target.value;sv()};
function pagesUI(){const b=$('#pagesPanel');b.innerHTML='<h4>Pages (drag to reorder)</h4>';doc.pages.forEach((p,i)=>{const d=document.createElement('div');d.className='card'+(i===doc.cur?' on':'');d.draggable=true;
  const cv=document.createElement('canvas');cv.width=192;cv.height=108;const bb=bounds(p);renderTo(cv.getContext('2d'),p,bb,Math.min(192/bb.w,108/bb.h));d.append(cv,'Page '+(i+1));
  d.onclick=()=>go(i);d.ondragstart=e=>e.dataTransfer.setData('t',i);d.ondragover=e=>e.preventDefault();
  d.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('t'),cp=pg();doc.pages.splice(i,0,doc.pages.splice(f,1)[0]);go(doc.pages.indexOf(cp));sv()};b.append(d)})}
async function lessons(){const all=((await dbq('readonly',s=>s.getAll()))||[]).sort((a,b)=>b.upd-a.upd),b=$('#lsPanel');b.innerHTML='<h4>Saved lessons</h4>';
  const n=document.createElement('div');n.className='li';n.textContent='+ New lesson';n.onclick=()=>{doc={id:Date.now(),name:'Untitled lesson',pages:[newPage()],cur:0};$('#nm').value=doc.name;go(0);sv();b.classList.remove('open')};b.append(n);
  all.forEach(d=>{const e=document.createElement('div');e.className='li';e.textContent=`${d.name} · ${d.pages.length} pg · ${new Date(d.upd).toLocaleDateString()}`;e.onclick=()=>{hydrate(d);b.classList.remove('open')};b.append(e)})}

/* ================= view / coordinates =================
   screen = world * k + (x,y). Items are stored in WORLD units, so zoom never alters data. */
const vw=c=>{const v=pg().view;c.setTransform(dpr*v.k,0,0,dpr*v.k,dpr*v.x,dpr*v.y)};
const toW=e=>{const r=stage.getBoundingClientRect(),v=pg().view;return{x:(e.clientX-r.left-v.x)/v.k,y:(e.clientY-r.top-v.y)/v.k}};
function rp(){const P=pg().paper,v=pg().view;pc.setTransform(1,0,0,1,0,0);pc.fillStyle=P.bg;pc.fillRect(0,0,paperC.width,paperC.height);vw(pc);
  const x0=-v.x/v.k,y0=-v.y/v.k;drawPaper(pc,P,x0,y0,x0+stage.clientWidth/v.k,y0+stage.clientHeight/v.k,v.k)}
function ri(){ic.setTransform(1,0,0,1,0,0);ic.clearRect(0,0,inkC.width,inkC.height);vw(ic);pg().items.forEach(s=>drawItem(ic,s))}
function vchg(){$('#zv').textContent=Math.round(pg().view.k*100)+'%';rp();ri();rl()}
function zoomAt(cx,cy,k){const v=pg().view;k=Math.min(8,Math.max(.05,k));v.x=cx-(cx-v.x)*k/v.k;v.y=cy-(cy-v.y)*k/v.k;v.k=k;vchg()}
const zc=f=>zoomAt(stage.clientWidth/2,stage.clientHeight/2,pg().view.k*f);
$('#zi').onclick=()=>zc(1.25);$('#zo').onclick=()=>zc(.8);$('#zv').onclick=()=>zc(1/pg().view.k);
$('#fit').onclick=()=>{pg().view={x:150,y:80,k:Math.min(1,(stage.clientWidth-220)/1600)};vchg();sv()};
stage.addEventListener('wheel',e=>{e.preventDefault();const v=pg().view;if(e.ctrlKey){const r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,v.k*Math.exp(-e.deltaY*.01))}else{v.x-=e.deltaX;v.y-=e.deltaY;vchg()}},{passive:false});

/* ================= drawing items ================= */
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const FONT=z=>`${z}px system-ui,"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif`;
function shapePts(s){const{a,b}=s;switch(s.kind){
  case'line':return[[a,b]];case'rect':return[[a,{x:b.x,y:a.y},b,{x:a.x,y:b.y},a]];
